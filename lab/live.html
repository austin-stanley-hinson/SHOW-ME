<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Show Me Live Lab</title>
<style>
  :root { --bg: #000; --ink: #fff; --muted: #b9c2cc; --accent: #ffcc00; --panel: rgba(0,0,0,.72); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.35 system-ui, -apple-system, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #top { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; display: flex; gap: 8px; align-items: center; background: linear-gradient(var(--panel), transparent); }
  #status { font-size: 13px; color: var(--muted); flex: 1; }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); background: linear-gradient(transparent, var(--panel) 30%); }
  #said { min-height: 1.4em; font-size: 18px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #heard { min-height: 1.2em; font-size: 14px; color: var(--muted); margin-top: 4px; }
  #math { font: 13px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; margin-top: 6px; color: #fff; max-height: 30vh; overflow: auto; }
  #row { display: flex; gap: 8px; margin-top: 8px; }
  button, input { font: inherit; border-radius: 12px; border: 0; min-height: 48px; }
  button { padding: 0 16px; background: #fff; color: #000; font-weight: 700; }
  button.alt { background: #2a2f36; color: #fff; }
  input { flex: 1; padding: 0 12px; background: #1b1f24; color: #fff; min-width: 0; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: #000; z-index: 5; text-align: center; padding: 24px; }
  #start button { font-size: 20px; min-height: 64px; padding: 0 32px; background: var(--accent); }
  #start p { color: var(--muted); max-width: 32ch; margin: 16px auto 0; }
</style>
</head>
<body>
<div id="stage"><video id="video" playsinline muted autoplay></video><canvas id="overlay"></canvas></div>
<div id="top"><span id="status">Not connected</span><button class="alt" id="report">Report</button><button class="alt" id="mute">Mute mic</button><button class="alt" id="end">End</button></div>
<div id="bottom">
  <div id="said"></div>
  <div id="heard"></div>
  <div id="math"></div>
  <div id="row"><input id="typed" placeholder="…or type a question" enterkeyhint="send" /><button id="send">Send</button></div>
</div>
<div id="start"><div><button id="go">Start live</button><p>Point the camera at something and just talk. It watches, answers out loud and draws on what it sees. Uses the camera and microphone.</p></div></div>
<script type="module" src="./live-main.js"></script>
</body>
</html>
